<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
overflow:hidden;
}

.quiz-box{
background:#1e293b;
padding:30px;
border-radius:20px;
width:100%;
max-width:500px;
box-shadow:0 0 25px #00e6ff;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 15px #00e6ff;}
to{box-shadow:0 0 35px #8b5cf6;}
}

#timer{
margin-bottom:15px;
color:#00e6ff;
font-size:22px;
}

.option{
background:#111827;
padding:15px;
margin-top:12px;
border-radius:12px;
cursor:pointer;
transition:0.3s;
font-size:18px;
}

.option:hover{
background:#00e6ff;
color:black;
transform:scale(1.03);
}

#nextBtn{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:12px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
display:none;
font-size:18px;
}

#score{
margin-top:20px;
font-size:24px;
color:#22c55e;
text-align:center;
}

.progress{
width:100%;
height:12px;
background:#111827;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress-bar{
height:100%;
width:0%;
background:#00e6ff;
transition:0.4s;
}
</style>
</head>

<body>

<div class="quiz-box">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h3 id="timer">⏳ Time Left: 15</h3>

<h2 id="question">Loading Quiz...</h2>

<div id="answers"></div>

<button id="nextBtn" onclick="nextQuestion()">Next Question</button>

<div id="score"></div>

</div>

<script src="questions.js"></script>

<script>

let current = 0;
let score = 0;
let timeLeft = 15;
let timer;

const correctSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3");
const wrongSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3");

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");

function startTimer(){
clearInterval(timer);
timeLeft = 15;

timer = setInterval(()=>{
timeLeft--;
document.getElementById("timer").innerText = "⏳ Time Left: " + timeLeft;

if(timeLeft <= 0){
clearInterval(timer);
nextQuestion();
}
},1000);
}

function updateProgress(){
if(!quiz || quiz.length === 0) return;
progressBar.style.width = ((current)/quiz.length)*100 + "%";
}

function loadQuestion(){

// 🔥 SAFETY FIX (IMPORTANT)
if(!quiz || quiz.length === 0){
questionEl.innerText = "❌ Questions load nahi ho rahe";
return;
}

startTimer();
updateProgress();

nextBtn.style.display="none";

let q = quiz[current];

questionEl.innerText = q.question;
answersEl.innerHTML = "";

q.answers.forEach(answer=>{
let div = document.createElement("div");
div.classList.add("option");
div.innerText = answer;

div.onclick = ()=>checkAnswer(answer);

answersEl.appendChild(div);
});
}

function checkAnswer(answer){

clearInterval(timer);

let correct = quiz[current].correct;

document.querySelectorAll(".option").forEach(option=>{
option.style.pointerEvents="none";

if(option.innerText === correct){
option.style.background="#22c55e";
}

if(option.innerText === answer && answer !== correct){
option.style.background="red";
}
});

if(answer === correct){
score++;
correctSound.play();
}else{
wrongSound.play();
}

nextBtn.style.display="block";
}

function nextQuestion(){

current++;

if(current < quiz.length){
loadQuestion();
}else{

progressBar.style.width="100%";

questionEl.innerText="🎉 Quiz Finished!";
answersEl.innerHTML="";
nextBtn.style.display="none";

document.getElementById("timer").innerText="";

document.getElementById("score").innerHTML=
"🏆 Your Score: " + score + " / " + quiz.length;
}
}

loadQuestion();

</script>

</body>
</html>
