<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX PRO 125</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:20px;
border-radius:15px;
width:95%;
max-width:700px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
color:#fbbf24;
margin-bottom:10px;
}

#timer{color:#00e6ff;}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:12px;
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00e6ff;
font-weight:bold;
}

.previewBox{
position:absolute;
top:50px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="section">START</div>
<div id="timer">⏳ 15</div>
<div>Score: <span id="score">0</span>/125</div>
</div>

<h2 id="q">Loading...</h2>
<div id="a"></div>

<button onclick="togglePreview()">👁 Preview</button>

<div class="previewBox" id="previewBox"></div>

<div id="resultText"></div>

</div>

<audio id="rightSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

/* ================= QUIZ DATA ================= */

let quiz = [];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({
sec,
q:q.q,
o:q.o,
c:q.c,
diff:q.diff
});
});
}

/* ================= HARD QUESTIONS ================= */

/* PHYSICS (25) */
add("PHYSICS",[
{q:"Unit of Planck constant?",o:["J·s","N","W","Pa"],c:0,diff:"Hard"},
{q:"Which particle has no charge?",o:["Neutron","Proton","Electron","Photon"],c:0,diff:"Hard"},
{q:"E=mc² belongs to?",o:["Relativity","Quantum","Newton","Thermo"],c:0,diff:"Hard"},
{q:"SI unit of magnetic flux?",o:["Weber","Tesla","Henry","Gauss"],c:0,diff:"Hard"},
{q:"Photon has?",o:["Massless","Massive","Negative charge","Positive charge"],c:0,diff:"Hard"},
{q:"Ohm = ?",o:["V/A","A/V","W/V","J/s"],c:0,diff:"Hard"},
{q:"Speed of EM wave in vacuum?",o:["3×10^8 m/s","3×10^6","5×10^8","1×10^7"],c:0,diff:"Hard"},
{q:"Lens formula?",o:["1/f=1/v-1/u","F=ma","E=mc²","P=VI"],c:0,diff:"Hard"},
{q:"Work-energy unit same?",o:["Joule","Watt","Volt","Newton"],c:0,diff:"Hard"},
{q:"Sound cannot travel in?",o:["Vacuum","Solid","Liquid","Gas"],c:0,diff:"Hard"},
{q:"SI unit capacitance?",o:["Farad","Ohm","Henry","Tesla"],c:0,diff:"Hard"},
{q:"Acceleration due to gravity?",o:["9.8 m/s²","10","8","12"],c:0,diff:"Hard"},
{q:"Power formula?",o:["P=VI","P=F/A","P=V/I","P=IR"],c:0,diff:"Hard"},
{q:"Resistance unit?",o:["Ohm","Volt","Ampere","Watt"],c:0,diff:"Hard"},
{q:"Current formula?",o:["I=V/R","I=VR","I=R/V","I=V+R"],c:0,diff:"Hard"},
{q:"Wave speed formula?",o:["fλ","f/λ","λ/f","f+λ"],c:0,diff:"Hard"},
{q:"Mirror used in car?",o:["Convex","Concave","Plane","None"],c:0,diff:"Hard"},
{q:"Refraction law?",o:["Snell’s law","Ohm’s law","Newton law","Faraday law"],c:0,diff:"Hard"},
{q:"SI unit energy?",o:["Joule","Watt","Volt","Newton"],c:0,diff:"Hard"},
{q:"Frequency unit?",o:["Hertz","Newton","Joule","Watt"],c:0,diff:"Hard"},
{q:"Light speed medium highest?",o:["Vacuum","Air","Water","Glass"],c:0,diff:"Hard"},
{q:"Ohm law formula?",o:["V=IR","I=VR","V=I/R","R=VI"],c:0,diff:"Hard"},
{q:"SI unit force?",o:["Newton","Joule","Watt","Volt"],c:0,diff:"Hard"},
{q:"Energy equation?",o:["E=mc²","F=ma","P=VI","V=IR"],c:0,diff:"Hard"},
{q:"Transformer works on?",o:["AC","DC","Heat","Light"],c:0,diff:"Hard"}
]);

/* MATH (25) */
add("MATH",[
{q:"√196?",o:["14","12","16","18"],c:0,diff:"Hard"},
{q:"25²?",o:["625","525","725","425"],c:0,diff:"Hard"},
{q:"LCM of 8,12?",o:["24","16","20","28"],c:0,diff:"Hard"},
{q:"HCF 24,36?",o:["12","6","8","4"],c:0,diff:"Hard"},
{q:"3³?",o:["27","9","6","12"],c:0,diff:"Hard"},
{q:"15% of 300?",o:["45","30","60","75"],c:0,diff:"Hard"},
{q:"(a+b)²?",o:["a²+b²+2ab","a²-b²","a²+b²","2ab"],c:0,diff:"Hard"},
{q:"π value?",o:["3.14","2.14","3.41","4.13"],c:0,diff:"Hard"},
{q:"10²?",o:["100","200","50","150"],c:0,diff:"Hard"},
{q:"√225?",o:["15","12","18","20"],c:0,diff:"Hard"},
{q:"2⁵?",o:["32","16","64","8"],c:0,diff:"Hard"},
{q:"100/4?",o:["25","20","30","15"],c:0,diff:"Hard"},
{q:"Area of square formula?",o:["a²","2a","a³","4a"],c:0,diff:"Hard"},
{q:"Cube of 4?",o:["64","16","32","48"],c:0,diff:"Hard"},
{q:"√256?",o:["16","14","18","20"],c:0,diff:"Hard"},
{q:"20% of 500?",o:["100","50","150","200"],c:0,diff:"Hard"},
{q:"7×8?",o:["56","48","64","72"],c:0,diff:"Hard"},
{q:"9×12?",o:["108","96","120","144"],c:0,diff:"Hard"},
{q:"11²?",o:["121","111","131","141"],c:0,diff:"Hard"},
{q:"30×3?",o:["90","60","120","150"],c:0,diff:"Hard"},
{q:"15²?",o:["225","200","250","275"],c:0,diff:"Hard"},
{q:"LCM 5,10?",o:["10","15","20","25"],c:0,diff:"Hard"},
{q:"HCF 18,24?",o:["6","8","4","12"],c:0,diff:"Hard"},
{q:"100-37?",o:["63","53","73","83"],c:0,diff:"Hard"},
{q:"50×2?",o:["100","90","110","120"],c:0,diff:"Hard"}
]);

/* ENGLISH (25) */
add("ENGLISH",Array.from({length:25},(_,i)=>({
q:"English hard Q "+(i+1),
o:["Option A","Option B","Option C","Option D"],
c:0,
diff:"Hard"
})));

/* REASONING (25) */
add("REASONING",Array.from({length:25},(_,i)=>({
q:"Reasoning Q "+(i+1),
o:["A","B","C","D"],
c:0,
diff:"Hard"
})));

/* GK (25) */
add("GK",Array.from({length:25},(_,i)=>({
q:"GK Q "+(i+1),
o:["A","B","C","D"],
c:0,
diff:"Hard"
})));

/* ================= SHUFFLE ================= */

function shuffle(){
quiz.forEach(q=>{
let correct = q.o[q.c];
q.o = q.o.sort(()=>Math.random()-0.5);
q.c = q.o.indexOf(correct);
});
}
shuffle();

/* ================= LOGIC ================= */

let i=0;
let score=0;
let timer;
let time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>🎉 Done</h1><h2>Score: ${score}/125</h2>`;
return;
}

let q=quiz[i];

document.getElementById("section").innerText=q.sec+" | "+q.diff;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("a");
box.innerHTML="";

q.o.forEach((opt,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=opt;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function check(ans){
let q=quiz[i];

document.querySelectorAll(".option").forEach(o=>{
o.style.pointerEvents="none";
});

let correctText = q.o[q.c];

if(ans===q.c){
score++;
document.getElementById("rightSound").play();
}else{
document.getElementById("wrongSound").play();
}

document.getElementById("resultText").innerHTML =
"Correct Answer: <b>"+correctText+"</b>";

setTimeout(next,1200);
}

function next(){
i++;
load();
}

/* ================= PREVIEW ================= */

function togglePreview(){
let box=document.getElementById("previewBox");

if(box.style.display==="block"){
box.style.display="none";
return;
}

box.innerHTML="";

quiz.forEach((q,idx)=>{
let d=document.createElement("div");
d.className="previewItem";
d.innerText=(idx+1)+". "+q.sec;
d.onclick=()=>{
i=idx;
box.style.display="none";
load();
};
box.appendChild(d);
});

box.style.display="block";
}

load();

</script>

</body>
</html>
