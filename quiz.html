<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Test</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:90%;
max-width:500px;
text-align:center;
box-shadow:0 0 25px #00e6ff;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
}

.option:hover{
background:#00e6ff;
color:black;
}
</style>
</head>

<body>

<div class="box">
<h3 id="timer">⏳ 10</h3>
<h2 id="question">Loading...</h2>
<div id="answers"></div>
</div>

<script src="questions.js"></script>

<script>

let quiz=[];
let i=0;
let time=10;
let timer;

window.onload=function(){

if(!window.quiz){
document.getElementById("question").innerText="questions.js missing!";
return;
}

quiz=window.quiz;
load();
}

function load(){

if(i>=quiz.length){
document.body.innerHTML="<h1>🎉 Test Finished</h1>";
return;
}

let q=quiz[i];

document.getElementById("question").innerText=q.q;

let box=document.getElementById("answers");
box.innerHTML="";

q.a.forEach(x=>{
let d=document.createElement("div");
d.className="option";
d.innerText=x;

d.onclick=()=>check(x);

box.appendChild(d);
});

startTimer();
}

function startTimer(){

clearInterval(timer);
time=10;

timer=setInterval(()=>{

time--;
document.getElementById("timer").innerText="⏳ "+time;

if(time<=0){
i++;
load();
}

},1000);
}

function check(ans){

let correct=quiz[i].c;

document.querySelectorAll(".option").forEach(o=>{
o.style.pointerEvents="none";

if(o.innerText==correct){
o.style.background="green";
}
if(o.innerText==ans && ans!=correct){
o.style.background="red";
}
});

setTimeout(()=>{
i++;
load();
},600);
}

</script>

</body>
</html>
