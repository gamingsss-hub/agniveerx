let i=0;
let timer;
let time=15;

let rightSound=document.getElementById("rightSound");
let wrongSound=document.getElementById("wrongSound");

function load(){

if(i>=quiz.length){
document.body.innerHTML="<h1>🎉 Exam Finished</h1>";
return;
}

document.getElementById("section").innerText=quiz[i].sec+" TEST START";
document.getElementById("q").innerText=quiz[i].q;

let box=document.getElementById("a");
box.innerHTML="";

quiz[i].a.forEach(x=>{
let d=document.createElement("div");
d.className="option";
d.innerText=x;
d.onclick=()=>check(d,x);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;

if(time<=0){
showAnswer();
setTimeout(next,1000);
}
},1000);
}

function check(div,ans){
clearInterval(timer);

let correct=quiz[i].c;
let options=document.querySelectorAll(".option");

options.forEach(opt=>{
opt.style.pointerEvents="none";

if(opt.innerText===correct) opt.classList.add("correct");
if(opt.innerText===ans && ans!==correct) opt.classList.add("wrong");
});

if(ans===correct) rightSound.play();
else wrongSound.play();

setTimeout(next,1000);
}

function showAnswer(){
let correct=quiz[i].c;
document.querySelectorAll(".option").forEach(opt=>{
opt.style.pointerEvents="none";
if(opt.innerText===correct) opt.classList.add("correct");
});
}

function next(){
i++;
load();
}

load();
