<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:90%;
max-width:500px;
text-align:center;
box-shadow:0 0 25px #00e6ff;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#00e6ff;
color:black;
transform:scale(1.03);
}

.badge{
color:#00e6ff;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="box">

<div class="badge" id="badge">Rank: C</div>

<h2 id="question">Loading...</h2>
<div id="answers"></div>
<h3 id="timer">10</h3>

<div id="result"></div>

</div>

<audio id="right" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="wrong" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script src="questions.js"></script>

<script>

let quiz=[];
let current=0;
let time=10;
let timer;

let player=JSON.parse(localStorage.getItem("player"));

function updateRank(){

let r="C";
if(player.xp>100) r="B";
if(player.xp>200) r="A";
if(player.xp>350) r="S";

document.getElementById("badge").innerText="Rank: "+r;
}

window.onload=function(){
quiz=window.quiz;
updateRank();
load();
}

function load(){

let q=quiz[current];

document.getElementById("question").innerText=q.question;

let ans=document.getElementById("answers");
ans.innerHTML="";

q.answers.forEach(a=>{
let div=document.createElement("div");
div.className="option";
div.innerText=a;
div.onclick=()=>check(a);
ans.appendChild(div);
});

startTimer();
}

function startTimer(){

clearInterval(timer);
time=10;

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText=time;
if(time<=0) next();
},1000);
}

function check(a){

clearInterval(timer);

let correct=quiz[current].correct;

if(a==correct){
player.xp+=20;
player.coins+=10;
document.getElementById("right").play();
}else{
player.xp+=2;
document.getElementById("wrong").play();
}

player.level=Math.floor(player.xp/50)+1;

localStorage.setItem("player",JSON.stringify(player));

updateRank();

setTimeout(next,400);
}

function next(){

current++;

if(current<quiz.length){
load();
}
else{

document.getElementById("question").innerText="🎉 Mission Complete";

let percent=Math.floor((player.xp/(quiz.length*20))*100);

let grade="C";
if(percent>90) grade="S";
else if(percent>70) grade="A";
else if(percent>50) grade="B";

document.getElementById("answers").innerHTML=
"🏆 Score Grade: "+grade+
"<br>📊 XP: "+player.xp+
"<br>🪙 Coins: "+player.coins+
"<br>📈 Accuracy: "+percent+"%";

saveBoard();
}
}

function saveBoard(){

let board=JSON.parse(localStorage.getItem("board")||"[]");

board.push({
name:player.name,
xp:player.xp,
grade:document.getElementById("badge").innerText
});

localStorage.setItem("board",JSON.stringify(board));
}

</script>

</body>
</html>
