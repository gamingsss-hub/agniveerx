<!DOCTYPE html>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;

align-items:center;

}

.box{
width:95%;

padding:20px;

text-align:center;

}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;

}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correctFlash{background:#22c55e !important;}
.wrongFlash{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

<body>

<div class="box">

<div class="top">
<div id="section">START</div>
<div>Score: <span id="score">0</span>/110</div>
</div>

<h2 id="q">Loading...</h2>
<div id="options"></div>

<button onclick="nextQ()">Next</button>

quiz.push({sec,q:q.q,o:q.o,c:q.c});

/* ================= SHUFFLE ================= */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

/* ================= GAME LOGIC ================= */

let i=0,score=0;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("section").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("options");
box.innerHTML="";

q.o.forEach((opt,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=opt;
d.onclick=()=>check(idx);
box.appendChild(d);
});
}

function check(ans){
let q=quiz[i];
let correctText=q.o[q.c];

document.querySelectorAll(".option").forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){
score++;
document.getElementById("rightSound").play();
}else{
score--;
document.getElementById("wrongSound").play();
}

document.getElementById("score").innerText=score;
document.getElementById("result").innerHTML="Correct: "+correctText;

setTimeout(()=>{i++;load();},900);
}

load();

</script>
