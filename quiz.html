<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:90%;
max-width:500px;
text-align:center;
box-shadow:0 0 25px #00e6ff;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#00e6ff;
color:black;
transform:scale(1.03);
}

#timer{
margin:10px 0;
color:#00e6ff;
}
</style>
</head>

<body>

<div class="box">

<h3 id="timer">⏳ 10</h3>
<h2 id="question">Loading...</h2>

<div id="answers"></div>

</div>

<!-- IMPORTANT: questions.js MUST be same folder -->
<script src="questions.js"></script>

<script>

let quiz = [];
let current = 0;
let time = 10;
let timer;

// ---------- SAFE LOAD ----------
window.onload = function(){

if(typeof window.quiz === "undefined"){
document.getElementById("question").innerText =
"❌ questions.js not loaded!";
return;
}

quiz = window.quiz;

loadQuestion();
}

// ---------- LOAD QUESTION ----------
function loadQuestion(){

if(current >= quiz.length){
document.getElementById("question").innerText = "🎉 Quiz Finished!";
document.getElementById("answers").innerHTML = "";
document.getElementById("timer").innerText = "";
return;
}

let q = quiz[current];

document.getElementById("question").innerText = q.question;

let ansBox = document.getElementById("answers");
ansBox.innerHTML = "";

q.answers.forEach(a=>{
let div = document.createElement("div");
div.className = "option";
div.innerText = a;

div.onclick = ()=>{
checkAnswer(a);
};

ansBox.appendChild(div);
});

startTimer();
}

// ---------- TIMER ----------
function startTimer(){

clearInterval(timer);
time = 10;

document.getElementById("timer").innerText = "⏳ " + time;

timer = setInterval(()=>{

time--;
document.getElementById("timer").innerText = "⏳ " + time;

if(time <= 0){
clearInterval(timer);
next();
}

},1000);
}

// ---------- CHECK ----------
function checkAnswer(ans){

clearInterval(timer);

let correct = quiz[current].correct;

let options = document.querySelectorAll(".option");

options.forEach(opt=>{
opt.style.pointerEvents = "none";

if(opt.innerText === correct){
opt.style.background = "green";
}

if(opt.innerText === ans && ans !== correct){
opt.style.background = "red";
}
});

setTimeout(next, 800);
}

// ---------- NEXT ----------
function next(){
current++;
loadQuestion();
}

</script>

</body>
</html>
