<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Mock Test</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:90%;
max-width:500px;
text-align:center;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
}

.option:hover{
background:#00e6ff;
color:black;
}

#result{
margin-top:15px;
color:#22c55e;
}
</style>
</head>

<body>

<div class="box">
<h2 id="q">Loading...</h2>
<div id="a"></div>
<div id="result"></div>
</div>

<script>

let quiz=[
{q:"2+2?",a:["3","4","5"],c:"4"},
{q:"India capital?",a:["Delhi","Mumbai","Kolkata"],c:"Delhi"},
{q:"Water formula?",a:["H2O","CO2","O2"],c:"H2O"},
{q:"Sun rises in?",a:["East","West","North"],c:"East"},
{q:"5×5?",a:["20","25","30"],c:"25"}
];

let i=0;
let score=0;

function load(){

if(i>=quiz.length){
finish();
return;
}

document.getElementById("q").innerText=quiz[i].q;

let box=document.getElementById("a");
box.innerHTML="";

quiz[i].a.forEach(x=>{

let d=document.createElement("div");
d.className="option";
d.innerText=x;
d.onclick=()=>check(x);
box.appendChild(d);

});

}

function check(ans){
if(ans==quiz[i].c){
score++;
}
i++;
load();
}

function finish(){

let data=JSON.parse(localStorage.getItem("data")||"{}");

if(!data.xp){
data={xp:0,coins:0};
}

data.xp += score*25;
data.coins += score*10;

localStorage.setItem("data",JSON.stringify(data));

document.getElementById("q").innerText="🎉 Mission Complete";
document.getElementById("a").innerHTML="";
document.getElementById("result").innerHTML=
"Score: "+score+" | XP Added: "+(score*25);

setTimeout(()=>{
window.location.href="index.html";
},2000);

}

load();

</script>

</body>
</html>
