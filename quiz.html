<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
animation:fade 1s ease;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<div class="top">

<div>Score: <span id="score">0</span></div>

/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

/* GAME */
let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Done</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("section").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("a");
box.innerHTML="";

q.o.forEach((opt,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=opt;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) load();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),900);
}

function check(ans){
let q=quiz[i];
let correctText=q.o[q.c];

document.querySelectorAll(".option").forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){
score++;
document.getElementById("rightSound").play();
pop("+1 ✔","green");
}else{
score--;
document.getElementById("wrongSound").play();
pop("-1 ✖","red");
}

document.getElementById("score").innerText=score;
setTimeout(()=>{i++;load();},900);
}

function togglePreview(){
let box=document.getElementById("previewBox");
box.style.display=box.style.display==="block"?"none":"block";
box.innerHTML="";
quiz.forEach((q,idx)=>{
let d=document.createElement("div");
d.className="previewItem";
d.innerText=(idx+1)+". "+q.sec;
d.onclick=()=>{i=idx;load();box.style.display="none";};
box.appendChild(d);
});
}

load();

</script>
