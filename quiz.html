let i=0;
let timer;
let time=15;

function load(){

if(i>=quiz.length){
document.body.innerHTML="<h1>🎉 Exam Finished</h1>";
return;
}

document.getElementById("q").innerText=quiz[i].q;

let box=document.getElementById("a");
box.innerHTML="";

quiz[i].a.forEach(x=>{

let d=document.createElement("div");
d.className="option";
d.innerText=x;
d.onclick=()=>check(x);
box.appendChild(d);

});

startTimer();
}

function startTimer(){

clearInterval(timer);
time=15;

timer=setInterval(()=>{

time--;
document.getElementById("timer").innerText="⏳ "+time;

if(time<=0){
i++;
load();
}

},1000);
}

function check(ans){

i++;
load();
}

load();
