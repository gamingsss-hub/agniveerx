<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:90%;
max-width:500px;
text-align:center;
box-shadow:0 0 25px #00e6ff;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:10px;
cursor:pointer;
}

.option:hover{
background:#00e6ff;
color:black;
}
</style>
</head>

<body>

<div class="box">
<h3 id="timer">⏳ 10</h3>
<h2 id="question">Loading...</h2>
<div id="answers"></div>
</div>

<script>

let quiz = [
{
question:"भारत का राष्ट्रीय पशु?",
answers:["Lion","Tiger","Elephant","Horse"],
correct:"Tiger"
},
{
question:"2 + 2 = ?",
answers:["3","4","5","6"],
correct:"4"
},
{
question:"Sun rises in?",
answers:["West","North","East","South"],
correct:"East"
},
{
question:"Water formula?",
answers:["H2O","CO2","O2","NaCl"],
correct:"H2O"
},
{
question:"India capital?",
answers:["Mumbai","Delhi","Kolkata","Chennai"],
correct:"Delhi"
}
];

let current = 0;
let time = 10;
let timer;

window.onload = function(){
loadQuestion();
}

function loadQuestion(){

if(current >= quiz.length){
document.getElementById("question").innerText = "🎉 Quiz Finished!";
document.getElementById("answers").innerHTML = "";
document.getElementById("timer").innerText = "";
return;
}

let q = quiz[current];

document.getElementById("question").innerText = q.question;

let box = document.getElementById("answers");
box.innerHTML = "";

q.answers.forEach(a=>{
let div = document.createElement("div");
div.className = "option";
div.innerText = a;

div.onclick = function(){
check(a);
};

box.appendChild(div);
});

startTimer();
}

function startTimer(){

clearInterval(timer);
time = 10;

document.getElementById("timer").innerText = "⏳ " + time;

timer = setInterval(()=>{

time--;
document.getElementById("timer").innerText = "⏳ " + time;

if(time <= 0){
clearInterval(timer);
next();
}

},1000);
}

function check(ans){

clearInterval(timer);

let correct = quiz[current].correct;

let options = document.querySelectorAll(".option");

options.forEach(o=>{
o.style.pointerEvents = "none";

if(o.innerText == correct){
o.style.background = "green";
}

if(o.innerText == ans && ans != correct){
o.style.background = "red";
}
});

setTimeout(next,800);
}

function next(){
current++;
loadQuestion();
}

</script>

</body>
</html>
