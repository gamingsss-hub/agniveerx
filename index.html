<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX Level 3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
width:90%;
max-width:450px;
text-align:center;
box-shadow:0 0 25px #00e6ff33;
}

h1{
color:#00e6ff;
}

.stats{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.box{
background:#0f172a;
padding:10px;
border-radius:10px;
width:30%;
}

button{
margin-top:20px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00e6ff,#8b5cf6);
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<h1>🪖 AgniveerX LEVEL 3</h1>

<p id="user">Welcome Soldier</p>

<div class="stats">
<div class="box">XP<br><span id="xp">0</span></div>
<div class="box">Coins<br><span id="coins">0</span></div>
<div class="box">Rank<br><span id="rank">Rookie</span></div>
</div>

<button onclick="start()">🚀 Start Mission</button>
</div>

<script>

let player = localStorage.getItem("player") || "Guest";

document.getElementById("user").innerText="Welcome "+player;

// load data
let data = JSON.parse(localStorage.getItem("data")||"{}");

if(!data.xp){
data={xp:0,coins:0,rank:"Rookie"};
}

function getRank(xp){
if(xp>=200) return "Captain";
if(xp>=100) return "Soldier";
if(xp>=50) return "Cadet";
return "Rookie";
}

data.rank=getRank(data.xp);

localStorage.setItem("data",JSON.stringify(data));

document.getElementById("xp").innerText=data.xp;
document.getElementById("coins").innerText=data.coins;
document.getElementById("rank").innerText=data.rank;

function start(){
window.location.href="quiz.html";
}

</script>

</body>
</html>
