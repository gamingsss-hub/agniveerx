<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AgniveerX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

/* LOGIN */

#login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:
linear-gradient(135deg,#00e6ff,#8b5cf6);
}

.login-box{
background:#1e293b;
padding:40px;
border-radius:20px;
width:90%;
max-width:400px;
text-align:center;
box-shadow:0 0 30px #00e6ff;
}

.login-box h1{
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-top:15px;
font-size:16px;
outline:none;
}

.login-box button{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:12px;
background:#00e6ff;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.login-box button:hover{
transform:scale(1.05);
}

/* MAIN */

#main{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#111827;
position:sticky;
top:0;
z-index:100;
box-shadow:0 0 15px rgba(0,230,255,0.3);
}

.logo{
font-size:28px;
font-weight:700;
color:#00e6ff;
}

.user{
font-size:18px;
}

.hero{
padding:70px 20px;
text-align:center;
background:
linear-gradient(135deg,#00e6ff,#8b5cf6);
}

.hero h1{
font-size:45px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
}

.start-btn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:15px;
background:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.start-btn:hover{
transform:scale(1.08);
}

.section-title{
padding:25px;
font-size:28px;
color:#00e6ff;
}

.subjects{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-10px)
scale(1.05);

box-shadow:0 0 25px #00e6ff;
}

.subject-icon{
font-size:50px;
margin-bottom:10px;
}

.footer{
padding:25px;
text-align:center;
background:#111827;
margin-top:30px;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

<div class="login-box">

<h1>
⚡ AgniveerX Login
</h1>

<input
type="text"
id="name"
placeholder="Enter Your Name"
>

<button onclick="startApp()">
🚀 Enter
</button>

</div>

</div>

<!-- MAIN WEBSITE -->

<div id="main">

<div class="topbar">

<div class="logo">
⚡ AgniveerX
</div>

<div class="user">

👤
<span id="username"></span>

</div>

</div>

<div class="hero">

<h1>
🚀 Crack Agniveer Exam
</h1>

<p>
Practice 500+ Important Questions
</p>

<button class="start-btn"
onclick="location.href='quiz.html'">

▶ Start Quiz

</button>

</div>

<h2 class="section-title">
📚 Subjects
</h2>

<div class="subjects">

<div class="card">

<div class="subject-icon">
➗
</div>

<h2>Math</h2>

</div>

<div class="card">

<div class="subject-icon">
🧠
</div>

<h2>Reasoning</h2>

</div>

<div class="card">

<div class="subject-icon">
🌍
</div>

<h2>GK</h2>

</div>

<div class="card">

<div class="subject-icon">
🔬
</div>

<h2>Science</h2>

</div>

</div>

<div class="footer">

⚡ AgniveerX Quiz Platform

</div>

</div>

<script>

function startApp(){

let name =
document.getElementById("name").value;

if(name==""){

alert("Enter Your Name");

return;

}

localStorage.setItem("player",name);

document.getElementById("login")
.style.display="none";

document.getElementById("main")
.style.display="block";

document.getElementById("username")
.innerText=name;

}

window.onload=function(){

let savedName=
localStorage.getItem("player");

if(savedName){

document.getElementById("login")
.style.display="none";

document.getElementById("main")
.style.display="block";

document.getElementById("username")
.innerText=savedName;

}

}

</script>

</body>
</html>
