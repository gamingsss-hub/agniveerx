<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agniveer Mock Test | Army Exam Preparation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
width:90%;
max-width:450px;
text-align:center;
box-shadow:0 0 25px #00e6ff33;
}

h1{
color:#00e6ff;
font-size:22px;
}

.stats{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.box{
background:#0f172a;
padding:10px;
border-radius:10px;
width:30%;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00e6ff,#8b5cf6);
color:white;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
}

.small{
margin-top:10px;
font-size:12px;
opacity:0.7;
}
</style>
</head>

<body>

<div class="card">

<h1>🪖 Agniveer Mock Test</h1>

<p id="user">Welcome Soldier</p>

<div class="stats">
<div class="box">XP<br><span id="xp">0</span></div>
<div class="box">Coins<br><span id="coins">0</span></div>
<div class="box">Level<br><span id="lvl">1</span></div>
</div>

<button onclick="start()">🚀 Start Mission</button>
<button onclick="downloadCert()">🏅 Download Certificate</button>

<div class="small">Elite Indian Army Exam Preparation Platform</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("data") || "{}");

if(!data.xp){
data = {xp:0, coins:0};
}

let level = Math.floor(data.xp / 100) + 1;

document.getElementById("xp").innerText = data.xp;
document.getElementById("coins").innerText = data.coins;
document.getElementById("lvl").innerText = level;

document.getElementById("user").innerText =
"Welcome " + (localStorage.getItem("player") || "Soldier");

function start(){
window.location.href = "quiz.html";
}

function downloadCert(){

let name = localStorage.getItem("player") || "Soldier";

let text =
"AGNEVEER MOCK TEST CERTIFICATE\n\n"+
"Name: "+name+"\n"+
"Level: "+level+"\n"+
"XP: "+data.xp+"\n\n"+
"Status: Qualified Candidate";

let blob = new Blob([text], {type:"text/plain"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "Agniveer_Certificate.txt";
a.click();
}

</script>

</body>
</html>
