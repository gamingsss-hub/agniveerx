<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* glow background animation */
body::before{
content:"";
position:absolute;
width:300px;
height:300px;
background:#00e6ff;
filter:blur(120px);
top:10%;
left:20%;
opacity:0.2;
animation:move 6s infinite alternate;
}

@keyframes move{
from{transform:translateY(0px);}
to{transform:translateY(50px);}
}

.box{
position:relative;
z-index:1;
background:rgba(30,41,59,0.8);
backdrop-filter:blur(10px);
padding:35px;
border-radius:20px;
text-align:center;
width:90%;
max-width:420px;
box-shadow:0 0 25px rgba(0,230,255,0.3);
border:1px solid rgba(0,230,255,0.2);
}

h1{
font-size:28px;
margin-bottom:10px;
color:#00e6ff;
}

p{
font-size:13px;
opacity:0.7;
margin-bottom:20px;
}

input{
width:90%;
padding:14px;
border:none;
border-radius:12px;
outline:none;
font-size:16px;
background:#0f172a;
color:white;
border:1px solid #1e293b;
}

input:focus{
border:1px solid #00e6ff;
box-shadow:0 0 10px #00e6ff;
}

button{
margin-top:18px;
padding:14px 25px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#00e6ff,#8b5cf6);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
width:100%;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 15px #00e6ff;
}

.info{
margin-top:15px;
font-size:13px;
color:#00e6ff;
opacity:0.9;
}

.badge{
margin-top:10px;
font-size:12px;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="box">

<h1>🪖 AgniveerX</h1>
<p>India's Smart Army Mock Test Platform</p>

<input id="name" placeholder="Enter Your Name">

<button onclick="start()">🚀 Start Mission</button>

<div class="info" id="info"></div>
<div class="badge">⚡ Powered by AgniveerX System</div>

</div>

<audio id="click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>

function start(){

document.getElementById("click").play();

let name=document.getElementById("name").value;

if(!name){
alert("Enter Name");
return;
}

let today=new Date().toDateString();

let player=JSON.parse(localStorage.getItem("player")||"{}");

// streak system
if(player.name==name){
player.streak=(player.lastLogin==today)?player.streak:(player.streak||0)+1;
}else{
player={
name:name,
xp:0,
coins:0,
level:1,
streak:1
};
}

player.lastLogin=today;

localStorage.setItem("player",JSON.stringify(player));

document.getElementById("info").innerHTML=
"🔥 Daily Streak: "+player.streak+" days";

setTimeout(()=>{
window.location.href="quiz.html";
},900);
}

</script>

</body>
</html>
