<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AgniveerX Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#111827;
position:sticky;
top:0;
z-index:100;
box-shadow:0 0 15px rgba(0,230,255,0.3);
}

.logo{
font-size:28px;
font-weight:700;
color:#00e6ff;
text-shadow:0 0 10px #00e6ff;
}

.menu button{
padding:10px 18px;
border:none;
border-radius:12px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
margin-left:8px;
cursor:pointer;
}

.hero{
padding:70px 20px;
text-align:center;
background:
linear-gradient(135deg,#00e6ff,#8b5cf6);
animation: glow 3s infinite alternate;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
}

.start-btn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:15px;
background:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.start-btn:hover{
transform:scale(1.08);
}

@keyframes glow{

from{
box-shadow:0 0 10px #00e6ff;
}

to{
box-shadow:0 0 30px #8b5cf6;
}

}

.section-title{
padding:25px;
font-size:28px;
color:#00e6ff;
}

.subjects{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
cursor:pointer;
transition:0.3s;
border:1px solid rgba(255,255,255,0.1);
}

.card:hover{
transform:translateY(-10px)
scale(1.05);

box-shadow:0 0 25px #00e6ff;
}

.subject-icon{
font-size:50px;
margin-bottom:10px;
}

</style>

</head>

<body>
