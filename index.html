<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgniveerX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:30px;
border-radius:15px;
text-align:center;
width:90%;
max-width:400px;
box-shadow:0 0 15px #00e6ff;
}

h1{
color:#00e6ff;
margin-bottom:10px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
outline:none;
font-size:16px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.9;
}
</style>
</head>

<body>

<div class="box">
<h1>🪖 AgniveerX</h1>
<p>Mock Test Platform</p>

<input id="name" placeholder="Enter Your Name">

<button onclick="start()">Start Test</button>
</div>

<script>
function start(){

let name=document.getElementById("name").value;

if(name.trim()==""){
alert("Enter Name");
return;
}

localStorage.setItem("player",name);

window.location.href="quiz.html";
}
</script>

</body>
</html>
